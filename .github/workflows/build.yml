name: Build Sky Island Android

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0 cmake;3.10.2.4988404 ndk;23.2.8568313"

      - name: Install Android debug keystore
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US" \
              -noprompt
          fi
          keytool -list -keystore "$HOME/.android/debug.keystore" \
            -storepass android -alias androiddebugkey

      - name: Install Godot
        shell: bash
        run: |
          set -euo pipefail
          GODOT_VERSION="4.4.1"
          GODOT_ZIP="Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          TEMPLATE_TPZ="Godot_v${GODOT_VERSION}-stable_export_templates.tpz"

          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/${GODOT_ZIP}"
          unzip -q "$GODOT_ZIP"
          chmod +x "Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot

          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/${TEMPLATE_TPZ}"
          TEMPLATE_ROOT="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          TEMP_TEMPLATES="$RUNNER_TEMP/godot_templates"
          rm -rf "$TEMPLATE_ROOT" "$TEMP_TEMPLATES"
          mkdir -p "$TEMPLATE_ROOT" "$TEMP_TEMPLATES"
          unzip -q "$TEMPLATE_TPZ" -d "$TEMP_TEMPLATES"
          cp -a "$TEMP_TEMPLATES/templates/." "$TEMPLATE_ROOT/"
          test -s "$TEMPLATE_ROOT/android_debug.apk"
          test -s "$TEMPLATE_ROOT/android_release.apk"

      - name: Validate project
        run: |
          python3 .github/validate_project.py
          godot --headless --path . --editor --quit --verbose

      - name: Export APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ runner.temp }}/android-debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          set -euo pipefail
          cp "$HOME/.android/debug.keystore" "$GODOT_ANDROID_KEYSTORE_DEBUG_PATH"
          mkdir -p build
          godot --headless --path . --export-debug "Android" "build/SkyIsland-1.2.0.apk"
          test -s "build/SkyIsland-1.2.0.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: SkyIsland-1.2.0
          path: build/SkyIsland-1.2.0.apk
