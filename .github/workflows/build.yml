name: Build Sky Island Android

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Godot
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          unzip -q Godot_v4.4.1-stable_linux.x86_64.zip
          mkdir -p "$HOME/godot"
          mv Godot_v4.4.1-stable_linux.x86_64 "$HOME/godot/godot"
          chmod +x "$HOME/godot/godot"
          echo "$HOME/godot" >> "$GITHUB_PATH"

      - name: Install export templates
        run: |
          GODOT_VERSION="4.4.1.stable"
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/$GODOT_VERSION"
          mkdir -p "$TEMPLATE_DIR"
          wget -q https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz
          unzip -q Godot_v4.4.1-stable_export_templates.tpz -d /tmp/godot_templates
          cp -av /tmp/godot_templates/templates/. "$TEMPLATE_DIR/"

      - name: Static project checks
        run: python3 .github/validate_project.py

      - name: Validate project
        run: godot --headless --editor --path . --quit

      - name: Build APK
        run: |
          mkdir -p build
          godot --headless --path . --export-release "Android" "build/SkyIsland-1.1.0.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: SkyIsland-1.1.0
          path: build/SkyIsland-1.1.0.apk
