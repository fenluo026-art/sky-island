name: Build Sky Island Android

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0 cmake;3.10.2.4988404 ndk;23.2.8568313"

      - name: Prepare stable Android signing
        shell: bash
        env:
          SKY_ISLAND_KEYSTORE_BASE64: ${{ secrets.SKY_ISLAND_KEYSTORE_BASE64 }}
          SKY_ISLAND_KEYSTORE_PASSWORD: ${{ secrets.SKY_ISLAND_KEYSTORE_PASSWORD }}
          SKY_ISLAND_KEY_ALIAS: ${{ secrets.SKY_ISLAND_KEY_ALIAS }}
          SKY_ISLAND_KEY_PASSWORD: ${{ secrets.SKY_ISLAND_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${SKY_ISLAND_KEYSTORE_BASE64:-}" ] || [ -z "${SKY_ISLAND_KEYSTORE_PASSWORD:-}" ] || [ -z "${SKY_ISLAND_KEY_ALIAS:-}" ] || [ -z "${SKY_ISLAND_KEY_PASSWORD:-}" ]; then
            echo "Missing stable signing secrets. Add SKY_ISLAND_KEYSTORE_BASE64, SKY_ISLAND_KEYSTORE_PASSWORD, SKY_ISLAND_KEY_ALIAS and SKY_ISLAND_KEY_PASSWORD to the repository Actions secrets."
            exit 1
          fi
          echo "$SKY_ISLAND_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/sky-island.keystore"
          test -s "$RUNNER_TEMP/sky-island.keystore"

      - name: Install Godot
        shell: bash
        run: |
          set -euo pipefail
          GODOT_VERSION="4.4.1"
          GODOT_ZIP="Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          TEMPLATE_TPZ="Godot_v${GODOT_VERSION}-stable_export_templates.tpz"

          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/${GODOT_ZIP}"
          unzip -q "$GODOT_ZIP"
          chmod +x "Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot

          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/${TEMPLATE_TPZ}"
          TEMPLATE_ROOT="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          TEMP_TEMPLATES="$RUNNER_TEMP/godot_templates"
          rm -rf "$TEMPLATE_ROOT" "$TEMP_TEMPLATES"
          mkdir -p "$TEMPLATE_ROOT" "$TEMP_TEMPLATES"
          unzip -q "$TEMPLATE_TPZ" -d "$TEMP_TEMPLATES"
          cp -a "$TEMP_TEMPLATES/templates/." "$TEMPLATE_ROOT/"
          test -s "$TEMPLATE_ROOT/android_debug.apk"
          test -s "$TEMPLATE_ROOT/android_release.apk"

      - name: Validate project
        run: |
          set -euo pipefail
          mkdir -p build
          python3 .github/validate_project.py
          godot --headless --path . --editor --quit --verbose 2>&1 | tee build/godot-validation.log
          if grep -q "SCRIPT ERROR:" build/godot-validation.log; then
            echo "GDScript errors detected during Godot validation."
            exit 1
          fi

      - name: Verify project version
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/^version\/name="\([^"]*\)"$/\1/p' project.godot)
          CODE=$(sed -n 's/^version\/code=\([0-9]*\)$/\1/p' project.godot)
          test "$VERSION" = "1.4.0" || { echo "ERROR: project version is not 1.4.0 (got: $VERSION)"; exit 1; }
          test "$CODE" = "7" || { echo "ERROR: project version code is not 7 (got: $CODE)"; exit 1; }

      - name: Export APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ runner.temp }}/sky-island.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: ${{ secrets.SKY_ISLAND_KEY_ALIAS }}
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: ${{ secrets.SKY_ISLAND_KEY_PASSWORD }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ runner.temp }}/sky-island.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ secrets.SKY_ISLAND_KEY_ALIAS }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.SKY_ISLAND_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          godot --headless --path . --export-debug "Android" "build/SkyIsland-1.4.0.apk"
          test -s "build/SkyIsland-1.4.0.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: SkyIsland-1.4.0
          path: build/SkyIsland-1.4.0.apk
