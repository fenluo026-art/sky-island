name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: true

      - name: Import project
        run: godot --headless --editor --quit --path .

      - name: Build APK
        run: |
          mkdir -p build
          godot --headless --path . --export-release "Android" build/SkyIslandSandbox.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SkyIslandSandbox-Android
          path: build/SkyIslandSandbox.apk
